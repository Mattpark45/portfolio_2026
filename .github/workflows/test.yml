name: test
on:
  pull_request:
  push:
    branches: [human-mcp-web]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: npm test
      - name: 빌드 결과가 커밋되어 있는지 확인
        run: git diff --exit-code -- site
